<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header">
  <a routerLink="/" class="brand" aria-label="Workshape home">
    <img class="brand-logo" src="assets/workshape-logo.svg" alt="Workshape">
  </a>
  <button class="menu-toggle" type="button" (click)="menu.set(!menu())" [attr.aria-expanded]="menu()" aria-controls="site-navigation" aria-label="Toggle navigation">
    <span></span><span></span>
  </button>
  <nav id="site-navigation" [class.open]="menu()" aria-label="Primary navigation">
    <a routerLink="/services" routerLinkActive="active" (click)="menu.set(false)">Services</a>
    <a routerLink="/work" routerLinkActive="active" (click)="menu.set(false)">Work</a>
    <a routerLink="/process" routerLinkActive="active" (click)="menu.set(false)">Process</a>
    <a routerLink="/contact" routerLinkActive="active" class="nav-cta" (click)="menu.set(false)">Start a conversation</a>
  </nav>
  <button class="theme-toggle" type="button" (click)="theme.toggle()" [attr.aria-label]="theme.dark()?'Use light mode':'Use dark mode'">
    {{theme.dark()?'☀':'◐'}}
  </button>
</header>
<main id="main-content" tabindex="-1"><router-outlet /></main>
<footer>
  <span>© 2026 Workshape</span>
  <span>Software · Automation · Digital platforms</span>
  <a routerLink="/contact">Start a conversation →</a>
</footer>
