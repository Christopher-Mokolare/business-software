<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" height="260" role="img" aria-labelledby="title desc">
  <title id="title">Workshape</title>
  <desc id="desc">A bending flow line passing through three connected nodes representing connected workflows.</desc>
  <g transform="translate(60,25)">
    <path d="M0 55 Q30 0 60 30 Q90 60 110 10" fill="none" stroke="#2F6FED" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="55" r="9" fill="#0F2E5C"/>
    <circle cx="60" cy="30" r="9" fill="#2F6FED"/>
    <circle cx="110" cy="10" r="9" fill="#6FA8FF"/>
  </g>
  <text x="60" y="165" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="600" letter-spacing="1" fill="#0F172A">WORKSHAPE</text>
  <text x="60" y="195" font-family="'Segoe UI', Arial, sans-serif" font-size="14" letter-spacing="2" fill="#64748B">SOFTWARE &#8226; AUTOMATION &#8226; DIGITAL PLATFORMS</text>
</svg>